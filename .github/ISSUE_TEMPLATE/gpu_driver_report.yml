name: "GPU & Driver Test Report"
description: "Submit compatibility and performance results from your hardware (AMD, Intel, NVIDIA)."
title: "[Hardware Test]: "
labels: ["graphics", "testing", "benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Help us validate ARBORIA across varied GPU vendors, architectures, and driver versions.
  - type: input
    id: gpu_model
    attributes:
      label: GPU Model & Architecture
      placeholder: "e.g. AMD Radeon RX 6700 XT (RDNA 2) / Intel Arc A770 / NVIDIA RTX 4070"
    validations:
      required: true
  - type: input
    id: driver_os
    attributes:
      label: Driver Version & Operating System
      placeholder: "e.g. Adrenalin 24.3.1 on Ubuntu 22.04 LTS (Vulkan 1.3)"
    validations:
      required: true
  - type: input
    id: commit_hash
    attributes:
      label: Git Commit SHA
      placeholder: "e.g. cc3e0f2..."
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Overall Rendering Status
      options:
        - "Passes without visual artifacts or validation errors"
        - "Renders with visual discrepancies / LOD popping"
        - "Driver crash / Device loss / Vulkan validation errors"
        - "Fails to compile shaders"
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Benchmark Measurements
      description: "If you ran `bench/runner.py`, paste your p95 Frame Time, CPU Render, GPU Render, and VRAM usage."
  - type: textarea
    id: capture
    attributes:
      label: Screenshots & Visual Comparison
      description: "Attach reference render captures and any logs."
