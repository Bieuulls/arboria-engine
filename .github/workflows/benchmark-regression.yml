name: ARBORIA CI & Build

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare Test Assets
        run: |
          if (!(Test-Path "assets")) { New-Item -ItemType Directory -Path "assets" }
          Copy-Item -Path "project/assets/*" -Destination "assets/" -Recurse -Force

      - name: Build Release (Native Renderer & Tests)
        run: |
          cmake -S native/renderer -B native/renderer/build_release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/renderer/build_release --config Release

      - name: Run Native Advanced & Stress Tests
        run: |
          ctest --test-dir native/renderer/build_release --output-on-failure


      - name: Upload Precompiled DLLs
        uses: actions/upload-artifact@v4
        with:
          name: arboria-native-windows-x64
          path: |
            addons/arboria/bin/libarboria_native.dll
            project/addons/arboria/bin/libarboria_native.dll

